<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kabumzinha - Vitrine Virtual</title>
  <link rel="stylesheet" href="src/css/style.css
  ">
</head>
<body>
  <header>
    <h1>KABUMZINHA (Versão pobre)</h1>
    <p>Painel Interativo</p>
  </header>

  <main>
    <!-- Painel para contagem e exibição de mensagens -->
    <section id="painel-status">
      <h2>Painel de Interatividade</h2>
      <p>Total de cliques: <span id="contador">0</span></p>
      <p id="mensagem">Passe o mouse sobre os produtos ou clique para interagir.</p>
    </section>

    <!-- Container onde a vitrine será renderizada via JavaScript -->
    <section id="container-vitrine" class="vitrine-grid"></section>
  </main>

  <script src="src/js/script.js"></script>
</body>
</html>
